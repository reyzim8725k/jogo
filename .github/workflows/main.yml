name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: System Information
      run: |
        Write-Host "=== ENIGMANO RDP DEPLOYMENT ===" -ForegroundColor Green
        Write-Host "Instance Number: ${{ github.event.inputs.instance_number }}" -ForegroundColor Yellow
        Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow
        Write-Host "Workflow: $env:GITHUB_WORKFLOW" -ForegroundColor Yellow
        
        Write-Host "`n=== SYSTEM SPECIFICATIONS ===" -ForegroundColor Cyan
        Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory
        Get-WmiObject -Class Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors
        
    - name: Enable RDP
      run: |
        Write-Host "Enabling Remote Desktop..." -ForegroundColor Green
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Create User Account
      run: |
        Write-Host "Setting up user account..." -ForegroundColor Green
        $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"
        Write-Host "Username: runneradmin" -ForegroundColor Yellow
        Write-Host "Password: P@ssw0rd!" -ForegroundColor Yellow
        
    - name: Install Tailscale (Silent)
      run: |
        Write-Host "Downloading Tailscale..." -ForegroundColor Green
        $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
        $installerPath = "$env:TEMP\tailscale.msi"
        Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
        Write-Host "Installing Tailscale silently..." -ForegroundColor Green
        Start-Process msiexec.exe -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait
        Remove-Item $installerPath -Force
        Write-Host "Tailscale installed successfully!" -ForegroundColor Green
        
    - name: Start Tailscale
      run: |
        Write-Host "Starting Tailscale..." -ForegroundColor Green
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }} --hostname "enigmano-${{ github.run_id }}"
        Start-Sleep -Seconds 15
        
    - name: Get Tailscale IP
      run: |
        $tsIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
        Write-Host "Tailscale IP: $tsIP" -ForegroundColor Green
        echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

    - name: Install and Configure AnyDesk
      run: |
        Write-Host "Downloading AnyDesk..." -ForegroundColor Green
        $anydeskUrl = "https://download.anydesk.com/AnyDesk.exe"
        $installerPath = "$env:TEMP\AnyDesk.exe"
        Invoke-WebRequest -Uri $anydeskUrl -OutFile $installerPath
        
        Write-Host "Installing AnyDesk silently..." -ForegroundColor Green
        # Instalação silenciosa do AnyDesk (geralmente aceita --install com parâmetros ou cópia/execução do executável portátil / instalador)
        # O AnyDesk suporta --install <path> --start-with-win --silent ou instalação padrão via instalador oficial com /S /install
        Start-Process -FilePath $installerPath -ArgumentList "--install `"`" --silent" -Wait -ErrorAction SilentlyContinue
        
        # Caso o instalador padrão exija outro método, alternativa robusta: garantir que o executável rode e configure senha
        Start-Sleep -Seconds 5
        
        # Configurar senha do AnyDesk (senha padrão configurada: P@ssw0rd! ou via secret/variável, usaremos P@ssw0rd! para coincidir com o RDP ou uma senha segura)
        $anydeskPass = "P@ssw0rd!"
        Write-Host "Setting AnyDesk password..." -ForegroundColor Green
        
        # AnyDesk permite definir senha via echo no processo ou registro/configuração (ou comando echo senha | AnyDesk --set-password)
        # Vamos usar o comando nativo do AnyDesk para definir a senha interativamente ou via echo
        $anydeskPath = "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe"
        if (-not (Test-Path $anydeskPath)) {
            $anydeskPath = "$env:ProgramFiles\AnyDesk\AnyDesk.exe"
        }
        if (-not (Test-Path $anydeskPath)) {
            $anydeskPath = "$env:APPDATA\AnyDesk\AnyDesk.exe"
        }
        if (-not (Test-Path $anydeskPath)) {
            $anydeskPath = "$env:LOCALAPPDATA\AnyDesk\AnyDesk.exe"
        }
        if (-not (Test-Path $anydeskPath)) {
            # Fallback para o executável baixado se a instalação falhou
            $anydeskPath = $installerPath
        }
        
        Write-Host "Using AnyDesk at: $anydeskPath" -ForegroundColor Yellow
        
        # Definir senha usando echo
        echo $anydeskPass | & $anydeskPath --set-password
        
        # Obter o ID do AnyDesk
        # O ID do AnyDesk pode ser lido do arquivo ad_svc.trace ou via comando /get_id se suportado, ou lido do registro / appdata config
        Start-Sleep -Seconds 5
        $anydeskId = & $anydeskPath --get-id
        if (-not $anydeskId) {
            # Tentar ler do registro ou log se o comando retornar vazio
            $anydeskId = (Get-ItemProperty -Path "HKLM:\SOFTWARE\AnyDesk" -Name "AdId" -ErrorAction SilentlyContinue).AdId
        }
        if (-not $anydeskId) {
            # Tentar caminho alternativo no registro
            $anydeskId = (Get-ItemProperty -Path "HKCU:\Software\AnyDesk\connection_trace" -Name "id" -ErrorAction SilentlyContinue).id
        }
        
        if (-not $anydeskId) {
            $anydeskId = "Verificar nos logs do AnyDesk (Serviço em execução)"
        }
        
        Write-Host "AnyDesk ID: $anydeskId" -ForegroundColor Green
        Write-Host "AnyDesk Password: $anydeskPass" -ForegroundColor Green
        
        echo "ANYDESK_ID=$anydeskId" >> $env:GITHUB_ENV
        echo "ANYDESK_PASS=$anydeskPass" >> $env:GITHUB_ENV
        
    - name: Install Google Chrome (Direct)
      run: |
        Write-Host "Downloading Google Chrome..." -ForegroundColor Green
        $chromeUrl = "https://dl.google.com/chrome/install/latest/chrome_installer.exe"
        $installerPath = "$env:TEMP\chrome_installer.exe"
        Invoke-WebRequest -Uri $chromeUrl -OutFile $installerPath
        Write-Host "Installing Google Chrome silently..." -ForegroundColor Green
        Start-Process -FilePath $installerPath -ArgumentList "/silent /install" -Wait
        Remove-Item $installerPath -Force
        Write-Host "Google Chrome installed!" -ForegroundColor Green
        
    - name: Install 7-Zip (Direct)
      run: |
        Write-Host "Downloading 7-Zip..." -ForegroundColor Green
        $zipUrl = "https://www.7-zip.org/a/7z2409-x64.exe"
        $installerPath = "$env:TEMP\7z-installer.exe"
        Invoke-WebRequest -Uri $zipUrl -OutFile $installerPath
        Write-Host "Installing 7-Zip silently..." -ForegroundColor Green
        Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait
        Remove-Item $installerPath -Force
        Write-Host "7-Zip installed!" -ForegroundColor Green
        
    - name: Connection Details
      run: |
        Write-Host "`n=== CONNECTION DETAILS (TAILSCALE & ANYDESK) ===" -ForegroundColor Green
        Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Cyan
        Write-Host "║             ENIGMANO RDP ACCESS                  ║" -ForegroundColor Cyan  
        Write-Host "╠══════════════════════════════════════════════════╣" -ForegroundColor Cyan
        Write-Host "║ [TAILSCALE]                                      ║" -ForegroundColor Yellow
        Write-Host "║ Host IP:     $env:TAILSCALE_IP                   ║" -ForegroundColor White
        Write-Host "║ Username:    runneradmin                         ║" -ForegroundColor White
        Write-Host "║ Password:    P@ssw0rd!                           ║" -ForegroundColor White
        Write-Host "╠══════════════════════════════════════════════════╣" -ForegroundColor Cyan
        Write-Host "║ [ANYDESK]                                        ║" -ForegroundColor Yellow
        Write-Host "║ AnyDesk ID:  $env:ANYDESK_ID                     ║" -ForegroundColor White
        Write-Host "║ Password:    $env:ANYDESK_PASS                   ║" -ForegroundColor White
        Write-Host "╚══════════════════════════════════════════════════╝" -ForegroundColor Cyan
        
        Write-Host "`nConnection Instructions:" -ForegroundColor Yellow
        Write-Host "--- Tailscale Method ---" -ForegroundColor Cyan
        Write-Host "1. Install Tailscale on your device and log in" -ForegroundColor White
        Write-Host "2. Open Remote Desktop app and enter the Tailscale IP" -ForegroundColor White
        Write-Host "3. Use username 'runneradmin' and password 'P@ssw0rd!'" -ForegroundColor White
        Write-Host "--- AnyDesk Method ---" -ForegroundColor Cyan
        Write-Host "1. Open AnyDesk on your device" -ForegroundColor White
        Write-Host "2. Enter the AnyDesk ID shown above" -ForegroundColor White
        Write-Host "3. Enter the password 'P@ssw0rd!'" -ForegroundColor White
        
    - name: Keep Session Alive
      run: |
        Write-Host "`n=== SESSION ACTIVE ===" -ForegroundColor Green
        Write-Host "EnigMano RDP instance is now running!" -ForegroundColor Cyan
        Write-Host "Instance will remain active for up to 6 hours." -ForegroundColor Yellow
        Write-Host "Do not close this window to maintain the connection." -ForegroundColor Red
        
        $counter = 0
        while ($true) {
          $counter++
          Write-Host "Session active - Heartbeat #$counter ($(Get-Date))" -ForegroundColor Green
          
          $tsStatus = & "C:\Program Files\Tailscale\tailscale.exe" status
          if ($tsStatus -match "active") {
            Write-Host "Tailscale status: ACTIVE" -ForegroundColor Green
          } else {
            Write-Host "Tailscale status: ERROR - Restarting..." -ForegroundColor Red
            & "C:\Program Files\Tailscale\tailscale.exe" up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }} --hostname "enigmano-${{ github.run_id }}"
          }
          
          Start-Sleep -Seconds 60
        }
